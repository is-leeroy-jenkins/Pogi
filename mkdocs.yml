site_name: Pogi Documentation
site_description: Documentation for the Pogi SF-133 analytics and forecasting workbench.
site_author: Terry D. Eppler
site_url: https://is-leeroy-jenkins.github.io/Pogi/

repo_url: https://github.com/is-leeroy-jenkins/Pogi
repo_name: is-leeroy-jenkins/Pogi

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
  palette:
    - scheme: slate
      primary: blue
      accent: blue
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/css/pogi.css

extra_javascript:
  - assets/js/pogi.js

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Data Sources: data-sources.md
  - User Guide:
      - Overview: user-guide/index.md
      - Installation: user-guide/installation.md
      - Data Loading: user-guide/data-loading.md
      - Data Overview: user-guide/data-overview.md
      - Descriptive Statistics: user-guide/descriptive-statistics.md
      - Inferential Statistics: user-guide/inferential-statistics.md
      - Feature Analysis: user-guide/feature-analysis.md
      - Feature Engineering: user-guide/feature-engineering.md
      - Anomaly Detection: user-guide/anomaly-detection.md
      - Modeling: user-guide/modeling.md
      - Diagnostics: user-guide/diagnostics.md
  - API Reference:
      - Overview: api/index.md
      - Application: api/app.md
  - Development: development.md